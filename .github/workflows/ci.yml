name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit, scenario, chaos and end to end tests
        run: make test
      - name: Extended chaos run
        run: make chaos CHAOS_SECONDS=60
      - name: Deterministic simulation, 2000 seeds
        run: make sim SEEDS=2000
      - name: Every planted bug is caught
        run: make mutations
